name: CD
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

env:
  TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_bucket_name: ${{ vars.S3_BUCKET_NAME }}
  SITE_URL: ${{ vars.SITE_URL || 'https://www.rayanhameed.com' }}
  API_URL: ${{ vars.API_URL || 'https://73nhe22wt4.execute-api.ap-southeast-4.amazonaws.com/default/incrementVisitorCount' }}
jobs:
    deploy-infrastructure-and-frontend:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: lts/*
            cache: npm
            cache-dependency-path: frontend/package-lock.json
        - uses: hashicorp/setup-terraform@v4
        - uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION || 'ap-southeast-4' }}
        - run: aws sts get-caller-identity
        - name: Install frontend dependencies
          working-directory: frontend
          run: npm ci

        - name: Build frontend
          working-directory: frontend
          env:
              VITE_API_URL: ${{ vars.API_URL }}
          run: npm run build
        - name: Terraform initialization
          run: |
            terraform -chdir=infra init \
                -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ vars.TF_STATE_KEY }}" \
                -backend-config="region=${{ vars.AWS_REGION || 'ap-southeast-4' }}" \
                -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
                -backend-config="encrypt=true"
        - name: Terraform plan
          run: terraform -chdir=infra plan -out=tfplan
        - name: Terraform apply
          run: terraform -chdir=infra apply -auto-approve tfplan
        - name: sync S3 bucket
          run: aws s3 sync frontend/dist/ s3://${{ vars.S3_BUCKET_NAME || 'rayanhameed-resume' }} --delete
        - name: Invalidate CloudFront cache
          run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"